name: Source contracts

on:
  push:
    branches: [main, 'codex/public-base']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .agents/skills/verify-dataevolver/scripts/check_repository.py
      - run: python -m pip install ruff==0.17.0
      - run: ruff check --select F821 src tests .agents/skills/verify-dataevolver/scripts

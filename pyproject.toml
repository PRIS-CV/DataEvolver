[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataevolver"
version = "0.0.0"
description = "Goal-driven data synthesis with a durable execution Harness."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.optional-dependencies]
harness = ["jsonschema>=4", "pillow>=10"]
curation = ["jsonschema>=4", "pillow>=10", "pyarrow>=14"]
image-data = ["jsonschema>=4", "pillow>=10", "pyarrow>=14,<18", "huggingface-hub>=1.33,<2"]
surface = ["jsonschema>=4", "numpy>=1.24", "pillow>=10", "scipy>=1.14"]
vision = ["transformers>=5.17,<6", "safetensors>=0.4", "pillow>=10"]
image = ["torch>=2.4", "transformers>=5.17,<6", "accelerate", "safetensors>=0.4", "pillow>=10", "diffusers @ git+https://github.com/huggingface/diffusers.git"]
# Pip-managed runtime packages only. HYWorld vendor source checkouts, weights,
# Blender, and CUDA/native extensions remain target-host setup steps.
hyworld = [
    "accelerate",
    "anthropic",
    "basicsr",
    "diffusers",
    "diffsynth",
    "ftfy",
    "gsplat",
    "huggingface-hub",
    "imageio",
    "iopath",
    "lpips",
    "moviepy==1.0.3",
    "nerfview",
    "numpy<2",
    "opencv-python",
    "opentelemetry-api",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-sdk",
    "pillow",
    "qwen-vl-utils",
    "realesrgan",
    "rembg[gpu]",
    "rtree",
    "safetensors",
    "scikit-image",
    "scipy",
    "timm",
    "tokenizers==0.22.1",
    "torch",
    "torchvision",
    "transformers",
    "trimesh",
]
test = [
    "jsonschema>=4",
    "pytest",
    "numpy<2",
    "pillow>=10",
]

[project.scripts]
dataevolver = "dataevolver.harness.cli:main"
dataevolver-harness = "dataevolver.harness.cli:main"
dataevolver-stage0-web-research = "dataevolver.tools.stage0_web_research:main"
dataevolver-hyworld-pano = "dataevolver.workflows.hyworld.scene_pano:main"
dataevolver-hyworld-full-worldgen = "dataevolver.workflows.hyworld.full_worldgen:main"
dataevolver-hyworld-finalize-report = "dataevolver.workflows.hyworld.finalize_object_scene_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/dataevolver/testing"]
